name: Validate source layer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source preparation and packaging
        run: python -m unittest discover -s tests -v
      - name: Test new-tab URL handling
        run: node --test tests/destination.test.mjs
      - name: Build optional unsigned extension
        run: python scripts/package-extension.py
